[project]
name = "lbm-serve"
version = "0.1.0"
description = "Serve a vla_foundry diffusion_policy (LBM) checkpoint over openpi's websocket protocol"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Exactly the 17 third-party roots the serving path imports, nothing else.
# Pins match vla_foundry_internal's pyproject where it pinned, so a checkpoint trained
# there loads here bit-for-bit (verified: scripts/parity_check.sh).
#
# Dropped relative to vla_foundry_internal: ray, moto, rosbags, cuda-fps, matplotlib,
# protobuf, gitpython, click, num2words, tifffile, accelerate, sentencepiece, wandb, ruff,
# pytest, nest-asyncio, s3fs, timm, open-clip-torch, webdataset, tqdm.
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.57.3",    # CLIP text+vision tower, CLIPImageProcessor
    "diffusers>=0.34.0",       # FlowMatchingScheduler's module imports DDPMScheduler
    "numpy>=2.0",
    "scipy>=1.15.3",
    "einops>=0.8.1",
    "draccus>=0.11.5",         # the config system config.yaml is parsed by
    "pyyaml>=6.0",
    "pillow>=11.0",
    "opencv-python",           # image resize in RoboticsProcessor
    "tdigest-rs>=0.1.0",       # normalization statistics
    "websockets>=13.0",        # the openpi msgpack-over-websocket server
    "msgpack>=1.0",
    "fsspec>=2025.7.0",        # s3:// checkpoint/config reads in file_utils
    "boto3>=1.39.5",
    "botocore>=1.39.17",
]

[project.scripts]
lbm-serve = "vla_foundry.serving.lbm_policy_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vla_foundry*"]
